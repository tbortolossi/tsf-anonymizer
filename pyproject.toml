[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tsf-anonymizer"
version = "0.2.2"
description = "Anonymize PAN-OS tech support files (TSF) without losing debugging value, and prove it with a compare mode."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
tsf-anonymizer = "tsf_anonymizer.cli:main"

[tool.setuptools.packages.find]
include = ["tsf_anonymizer*"]

[tool.setuptools.package-data]
"tsf_anonymizer.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "E9"]
